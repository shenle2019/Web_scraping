plugins {
    id 'com.android.application'
}

android {
    namespace 'com.repl.shihuo'
    compileSdk 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.repl.shihuo"
        minSdk 24
        targetSdk 33
        versionCode 72001
        versionName "7.20.1"
        buildConfigField "String", "BASE_URL", "\"http://192.168.31.220:8000\""
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 让 .so 在安装时解压到 /data/app/.../lib/arm64，复刻课件里“删 so 绕过”的场景
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation files('libs/okhttp-3.14.9.jar', 'libs/okio-1.17.2.jar')
}
