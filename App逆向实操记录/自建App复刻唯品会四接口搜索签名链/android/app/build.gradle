plugins {
    id 'com.android.application'
}

android {
    namespace 'com.achievo.vipshop.repl'
    compileSdk 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.achievo.vipshop.repl"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "7.83.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
