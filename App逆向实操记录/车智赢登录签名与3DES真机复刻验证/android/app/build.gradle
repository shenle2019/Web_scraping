plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autohome.chezhiying'
    compileSdk 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.autohome.chezhiying.repl"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "3.56.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
